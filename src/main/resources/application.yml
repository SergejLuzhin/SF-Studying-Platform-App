# Учебная платформа — базовая конфигурация
#
# Параметры подключения к базе данных вынесены в переменные окружения.
# Профиль по умолчанию: dev

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      fail-on-empty-beans: false

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate: INFO
